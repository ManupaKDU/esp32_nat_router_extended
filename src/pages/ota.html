<!DOCTYPE html>
<html lang=en>

<head>
    <link rel="shortcut icon" type=image/x-icon href=favicon.ico>
    <meta charset=utf-8>
    <meta http-equiv=X-UA-Compatible content="IE=edge">
    <meta name=viewport content="width=device-width, initial-scale=1">
    <link rel=stylesheet href=styles-67aa3b0203355627b525be2ea57be7bf.css>
    <style>
        .spinner-border { display: inline-block; width: 1rem; height: 1rem; vertical-align: -0.125em; border: 0.2em solid currentColor; border-right-color: transparent; border-radius: 50%; animation: 0.75s linear infinite spinner-border; }
        @keyframes spinner-border { to { transform: rotate(360deg); } }
    </style>
    <title>OTA Update</title>
</head>

<body>
    <div class=container>
        <div class="row text-center">
            <h1>OTA Update</h1>
        </div>
        <div class="table-responsive">
            <table class="table table-striped" aria-label="OTA Update Information">
                <tbody class=text-center>
                    <tr>
                        <th scope="row">Current version</th>
                        <td>%s</td>
                    </tr>
                    <tr>
                        <th scope="row">Latest version</th>
                        <td>%s</td>
                    </tr>
                    <tr>
                        <th scope="row" class="align-middle">Changelog</th>
                        <td class="text-start">
                            <ul>%s</ul>
                        </td>
                    </tr>
                    <tr>
                        <th scope="row">Update Source</th>
                        <td><a href="%s" title="Source">%s</a></td>
                    </tr>
                    <tr>
                        <th scope="row">Chip type</th>
                        <td>%s</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <form action=/ota method=POST onsubmit="var b = this.querySelector('button[type=submit]'); if(b){ b.innerHTML = '<span class=\'spinner-border\' aria-hidden=\'true\'></span> Refreshing...'; b.classList.add('disabled'); }">
            <div class="form-group row col-12 col-md-4 offset-md-4 mt-2">
                <input type="hidden" name="func" value="versioncheck">
                <button type="submit" class="btn btn-primary">Refresh latest OTA infos</button>
            </div>
        </form>
        <form action=/otalog method=POST onsubmit="if(confirm('Are you sure you want to install the latest version? The device will become unresponsive during the update.')){ var b = this.querySelector('button[type=submit]'); if(b){ b.innerHTML = '<span class=\'spinner-border\' aria-hidden=\'true\'></span> Installing...'; b.classList.add('disabled'); } return true; } return false;">
            <div class="form-group row col-12 col-md-4 offset-md-4 mt-2">
                <input type="hidden" name="func" value="update">
                <button type="submit" class="btn btn-warning">Install latest version</button>
            </div>
        </form>

        <form action=/ota method=POST class="mt-4" onsubmit="var b = this.querySelector('button[type=submit]'); if(b) { b.innerHTML = '<span class=\'spinner-border spinner-border-sm\' aria-hidden=\'true\'></span> Saving...'; b.classList.add('disabled'); }">
            <input type="hidden" name="func" value="set_ota_url">
            <div class="form-group row col-12 col-md-8 offset-md-2">
                <label for="ota_url" class="form-label text-center fw-bold">Custom OTA Endpoint URL</label>
                <div class="input-group">
                    <input type="text" class="form-control" id="ota_url" name="ota_url" value="%s" placeholder="e.g. https://raw.githubusercontent.com/ManupaKDU/... or http://192.168.1.100:8080/" maxlength="200">
                    <button type="submit" class="btn btn-secondary">Save</button>
                </div>
                <small class="form-text text-muted text-center mt-1">Leave empty to use the default repository endpoint (ManupaKDU).</small>
            </div>
        </form>

        <div class="card p-3 col-12 col-md-8 offset-md-2 mt-4">
            <h5 class="card-title text-center fw-bold">Manual Firmware Upload</h5>
            <div class="mb-3">
                <label for="firmware_file" class="form-label">Select compiled firmware (.bin) file:</label>
                <div class="input-group">
                    <input type="file" class="form-control" id="firmware_file" accept=".bin">
                    <button type="button" class="btn btn-danger" id="upload_btn" onclick="startFirmwareUpload()">Upload &amp; Flash</button>
                </div>
                <small class="form-text text-muted">Uploads the binary directly to the next OTA partition and reboots.</small>
            </div>
            <div id="upload_progress_wrapper" style="display:none;">
                <div class="progress" style="height: 24px;">
                    <div id="upload_progress_bar" class="progress-bar progress-bar-striped progress-bar-animated bg-success" role="progressbar" style="width: 0;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0</div>
                </div>
                <div id="upload_msg" class="text-center mt-2 fw-bold"></div>
            </div>
        </div>

        <div class="form-group row col-12 col-md-4 offset-md-4 mt-5"> <a href=/ class="btn btn-light">Back</a> </div>
    </div>
    <script>
        function startFirmwareUpload() {
            var fi = document.getElementById('firmware_file');
            if (!fi.files || !fi.files.length) {
                alert('Please select a .bin firmware file first.');
                return;
            }
            var file = fi.files[0];
            if (!file.name.toLowerCase().endsWith('.bin')) {
                alert('Only .bin files are accepted.');
                return;
            }
            if (file.size > 1536000) {
                alert('File size (' + Math.round(file.size/1024) + ' KB) exceeds partition capacity (1500 KB).');
                return;
            }
            if (!confirm('Are you sure you want to flash ' + file.name + ' (' + Math.round(file.size/1024) + ' KB)? The device will flash the image and reboot.')) {
                return;
            }
            var btn = document.getElementById('upload_btn');
            var wrap = document.getElementById('upload_progress_wrapper');
            var bar = document.getElementById('upload_progress_bar');
            var msg = document.getElementById('upload_msg');
            btn.disabled = true;
            fi.disabled = true;
            wrap.style.display = 'block';
            msg.className = 'text-center mt-2 fw-bold text-primary';
            msg.innerText = 'Uploading and flashing to partition...';

            var pctChar = String.fromCharCode(37);
            var xhr = new XMLHttpRequest();
            xhr.open('POST', '/otaupload', true);
            xhr.setRequestHeader('Content-Type', 'application/octet-stream');
            xhr.setRequestHeader('X-File-Name', file.name);

            xhr.upload.onprogress = function(e) {
                if (e.lengthComputable) {
                    var pct = Math.round((e.loaded / e.total) * 100);
                    bar.style.width = pct + pctChar;
                    bar.innerText = pct + pctChar + ' (' + Math.round(e.loaded/1024) + '/' + Math.round(e.total/1024) + ' KB)';
                }
            };

            xhr.onload = function() {
                if (xhr.status === 200) {
                    bar.style.width = '100' + pctChar;
                    bar.innerText = '100' + pctChar;
                    msg.className = 'text-center mt-2 fw-bold text-success';
                    msg.innerText = 'Flash successful! Rebooting device, redirecting in 3 seconds...';
                    setTimeout(function() {
                        window.location.href = '/apply';
                    }, 3000);
                } else {
                    msg.className = 'text-center mt-2 fw-bold text-danger';
                    msg.innerText = 'Flashing failed: ' + (xhr.responseText || ('HTTP ' + xhr.status));
                    btn.disabled = false;
                    fi.disabled = false;
                }
            };

            xhr.onerror = function() {
                msg.className = 'text-center mt-2 fw-bold text-danger';
                msg.innerText = 'Network error or connection lost during upload.';
                btn.disabled = false;
                fi.disabled = false;
            };

            xhr.send(file);
        }
    </script>
</body>

</html>
